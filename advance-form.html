<html>
    <head>
        <title>Advance Form</title>
    </head>
    <body>
        <h1>Advance Form Fields</h1>


        <form action="">

            <!-- input type text -->
            <label for="full-name">Full Name</label>
            <input type="text" id="full-name" required>
            <br>
            <br>

            <!-- input type email -->
             <label for="email">Email</label>
             <input type="email" id="email" required>
             <br>
             <br>

             <!-- input type password -->
              <label for="password">Password</label>
              <input type="password" id="password">
              <br>
              <br>

            <!-- input type number -->
              <label for="age">Age</label>
              <input type="number" id="age" min="0" max="100">
              <br>
              <br>

              <!-- input type date -->
              <label for="date-of-birth">Date Of Birth</label>
              <input type="date"  id="date-of-birth">

              <!-- input type datetime-local. don't use input type datetime. datetime is deprecated -->
               <label for="tika-sait">Dashain Tika</label>
               <input type="datetime-local"  id="tika-sait">
               <br>
               <br>

               <!-- input type tel (phone numbers) -->
                <label for="phone-number">Phone Number</label>
                <input type="tel" id="phone-number">
                <br>
                <br>
                <label for="color">Color</label>
                <input type="color" id="color">
                <br>
                <br>

                

                <input type="radio" id="male" name="gender">
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender">
                <label for="female">Female</label>

                <input type="radio" id="others" name="gender"> 
                <label for="others">Others</label>

                <br>
                <br>


              <!-- submit button -->
               <button>Submit</button>
        </form>
    </body>
</html>
