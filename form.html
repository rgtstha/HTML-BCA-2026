<html>
    <head>
        <title>Form</title>
    </head>
    <body>
        <h1>Form Example</h1>

        <!-- Important tags
        - form
        - label
        - input
        - button -->

        <!-- input types
        - text
        - password
        - email
        -->

       <form>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="your email" required>
        <br>
        <br>
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="your password" required>
        <br>
        <br>
         <button>Login</button>
       </form>


    </body>
</html>
