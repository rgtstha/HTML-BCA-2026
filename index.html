<html>

<head>
    <title>List Items Example</title>
</head>

<body>
    <h1>List Item Examples</h1>
    <p>This is example of creating ordered list and unordered list items.</p>
    <h2>Fruits</h2>
    <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>Grapes</li>
        <li>orange</li>
    </ul>

    <h2>Vegetables</h2>
    <ol>
        <li>Potato</li>
        <li>Tomato</li>
        <li>Onion</li>
        <li>Cauliflower</li>
    </ol>

</body>

</html>
